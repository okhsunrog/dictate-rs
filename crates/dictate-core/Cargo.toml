[package]
name = "dictate-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Audio capture, transcription and editing engine for Dictate"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eitype = { version = "0.2.2", default-features = false }
hound = "3.5.1"
nix = { version = "0.31.3", features = ["fs", "process", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "time", "macros", "net"] }
tokio-util = "0.7.19"
toml = "1.1.6"
