# Copy to ~/.config/dictate/config.toml and restrict access with chmod 600.
# Editing uses chat/completions. When stt_provider=chatgpt_proxy, this service
# also handles audio/transcriptions (model=chatgpt-transcribe).
base_url = "https://proxy.example.com/v1"
api_key = ""
model = "your-editing-model"

# chatgpt_proxy (default, also used by old configs) or elevenlabs (Scribe v2).
stt_provider = "chatgpt_proxy"
# Alternatively set ELEVENLABS_API_KEY; environment keys are never saved.
elevenlabs_api_key = ""

# Empty = automatic language detection or the default PipeWire input.
language = ""
microphone = ""

# Default workflow. Flags can override either choice for one recording.
# presentation: overlay (compact bottom bar) or window (editor after recording).
presentation = "overlay"
# output: preview (review, then Copy & close), clipboard (auto copy), paste.
output = "preview"

# Send Ctrl+Shift+V instead of Ctrl+V in paste mode.
paste_shift = false
